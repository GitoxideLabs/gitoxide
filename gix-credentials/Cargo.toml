lints.workspace = true

[package]
name = "gix-credentials"
version = "0.42.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project to interact with git credentials helpers"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde", "gix-sec/serde"]

[dependencies]
gix-lock = { version = "^26.0.1", path = "../gix-lock" }
gix-sec = { version = "^0.16.1", path = "../gix-sec" }
gix-error = { version = "^0.5.2", path = "../gix-error", features = ["bstr"] }
gix-url = { version = "^0.40.1", path = "../gix-url" }
gix-path = { version = "^0.14.1", path = "../gix-path" }
gix-quote = { version = "^0.10.1", path = "../gix-quote" }
gix-command = { version = "^0.12.1", path = "../gix-command" }
gix-config-value = { version = "^0.21.1", path = "../gix-config-value" }
gix-prompt = { version = "^0.19.1", path = "../gix-prompt" }
gix-date = { version = "^0.18.1", path = "../gix-date" }
gix-trace = { version = "^0.3.1", path = "../gix-trace" }

serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
percent-encoding = "2.3.1"



document-features = { version = "0.2.1", optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.4", features = ["event"] }

[dev-dependencies]
insta = "1.46.3"
gix-sec = { path = "../gix-sec" }
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

[package.metadata.cargo-machete]
ignored = [
    # Public optional `serde` feature is retained for downstream feature compatibility.
    "serde",
]

[package]
name = "gix-merge-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
anyhow = "1.0.76"
libfuzzer-sys = "0.4"
arbitrary = { version = "1.3.2", features = ["derive"] }
imara-diff = { package = "gix-imara-diff", version = "0.2.0", path = "../../gix-imara-diff" }
gix-diff = { path = "../../gix-diff" }
gix-error = { path = "../../gix-error" }
gix-filter = { path = "../../gix-filter" }
gix-hash = { path = "../../gix-hash", features = ["sha1"] }
gix-merge = { path = "..", features = ["sha1"] }
gix-object = { path = "../../gix-object" }
gix-odb = { path = "../../gix-odb" }
gix-worktree = { path = "../../gix-worktree" }

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "blob"
path = "fuzz_targets/blob.rs"
test = false
doc = false

[[bin]]
name = "tree"
path = "fuzz_targets/tree.rs"
test = false
doc = false

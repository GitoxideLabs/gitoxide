[package]
name = "gix-merge"
version = "0.20.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing merge algorithms"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lints]
workspace = true

[lib]
doctest = false

[[bench]]
name = "tree"
harness = false

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "gix-hash/serde", "gix-object/serde"]

[dependencies]
gix-hash = { version = "^0.26.2", path = "../gix-hash" }
gix-object = { version = "^0.64.1", path = "../gix-object" }
gix-filter = { version = "^0.34.0", path = "../gix-filter" }
gix-worktree = { version = "^0.56.0", path = "../gix-worktree", default-features = false, features = ["attributes"] }
gix-command = { version = "^0.10.1", path = "../gix-command" }
gix-path = { version = "^0.12.6", path = "../gix-path" }
gix-fs = { version = "^0.22.1", path = "../gix-fs" }
gix-tempfile = { version = "^24.0.0", path = "../gix-tempfile" }
gix-trace = { version = "^0.1.21", path = "../gix-trace" }
gix-quote = { version = "^0.8.0", path = "../gix-quote" }
gix-revision = { version = "^0.49.1", path = "../gix-revision", default-features = false, features = ["merge_base"] }
gix-revwalk = { version = "^0.35.0", path = "../gix-revwalk" }
gix-diff = { version = "^0.67.1", path = "../gix-diff", default-features = false, features = ["blob"] }
gix-index = { version = "^0.55.0", path = "../gix-index" }
gix-error = { version = "^0.3.0", path = "../gix-error" }
imara-diff = { package = "gix-imara-diff", version = "^0.2.5", path = "../gix-imara-diff" }

thiserror = "2.0.18"
bstr = { version = "1.12.0", default-features = false }
nonempty = "0.12.0"
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
criterion = "0.8.2"
gix-merge = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools", features = ["sha1", "sha256"] }
gix-odb = { path = "../gix-odb" }
gix-utils = { path = "../gix-utils" }
termtree = "1.0.0"
pretty_assertions = "1.4.0"
arbitrary = { version = "1.4.2", features = ["derive"] }

[package.metadata.docs.rs]
all-features = true
features = ["sha1", "document-features"]

[package.metadata.cargo-machete]
ignored = [
    # Doc-only macro dependency used under `all(doc, feature = "document-features")`.
    "document-features",
    # Optional `serde` feature is retained for downstream API compatibility.
    "serde",
]

lints.workspace = true

[package]
name = "internal-tools"
description = "internal CLI tooling to help generated test-cases"
version = "0.0.0"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
rust-version = "1.88"
default-run = "it"

[features]
default = ["tools"]
# Keep CI planning independent of the Git implementation and release tooling.
tools = ["dep:gix", "dep:gix-testtools", "dep:regex", "dep:tracing-subscriber", "dep:cargo-smart-release-core"]

[[bin]]
name = "it"
path = "src/main.rs"
required-features = ["tools"]

[[bin]]
name = "ci"
path = "src/ci/main.rs"

[[test]]
name = "check_api"
required-features = ["tools"]

[dependencies]
clap = { version = "4.5.60", features = ["derive"] }
gix = { version = "^0.90.0", path = "../../gix", optional = true, default-features = false, features = ["unstable", "attributes", "blame", "blob-diff", "error-print-location", "parallel", "revision", "sha1"] }
gix-testtools = { path = "../tools", optional = true, default-features = false, features = ["sha1"] }
gix-error = { path = "../../gix-error" }
regex = { version = "1.12.3", optional = true, default-features = false, features = ["std"] }
serde_json = "1.0.150"
tracing-subscriber = { version = "0.3.22", optional = true, default-features = false, features = ["fmt"] }
# shortcut: depend on the development branch, switch to a registry release once available.
cargo-smart-release-core = { git = "https://github.com/GitoxideLabs/cargo-smart-release", branch = "stability-support", optional = true }

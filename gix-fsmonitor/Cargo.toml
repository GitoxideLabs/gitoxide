lints.workspace = true

[package]
name = "gix-fsmonitor"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Git filesystem monitor clients and an embeddable server"
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
include = ["/src/**/*", "/LICENSE-*", "/README.md"]

[features]
## Serve Git's filesystem monitor IPC from an application-owned thread.
server = ["dep:getrandom", "dep:gix-lock", "dep:gix-notify", "dep:gix-parallel", "dep:gix-utils", "dep:libc", "dep:rustix", "dep:windows-sys"]
## Control foreground and detached daemons; includes the embeddable server.
daemon = ["server", "dep:sha1dc", "rustix/process", "dep:tempfile"]
## Opt in to Tokio clients and server orchestration. Blocking APIs remain available.
async = ["dep:tokio", "gix-notify?/async"]

[dependencies]
gix-command = { version = "^0.12.1", path = "../gix-command" }
gix-trace = { version = "^0.3.1", path = "../gix-trace" }
gix-error = { version = "^0.5.2", path = "../gix-error" }
gix-path = { version = "^0.14.1", path = "../gix-path" }
gix-packetline = { version = "^0.24.0", path = "../gix-packetline", features = ["blocking-io"] }
gix-macros = { version = "^0.2.1", path = "../gix-macros" }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "io-util", "macros", "process"], optional = true }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }

getrandom = { version = "0.4", features = ["std"], optional = true }
gix-notify = { version = "^0.1.0", path = "../gix-notify", optional = true }

gix-parallel = { version = "^0.50.1", path = "../gix-parallel", features = ["parallel"], optional = true }
gix-utils = { version = "^0.5.2", path = "../gix-utils", features = ["bstr"], optional = true }

[target.'cfg(unix)'.dependencies]
tempfile = "3.26.0"
sha1dc = { version = "0.1.3", default-features = false, features = ["std"], optional = true }
rustix = { version = "1.1.5", features = ["event", "net", "fs"], optional = true }
gix-lock = { version = "^27.0.0", path = "../gix-lock", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "0.2.183", optional = true }

[target.'cfg(not(unix))'.dependencies]
tempfile = { version = "3.26.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_System_Threading", "Win32_System_WindowsProgramming", "Win32_System_SystemServices", "Win32_Security", "Win32_Security_Authorization"], optional = true }

[dev-dependencies]
sha1dc = { version = "0.1.3", default-features = false, features = ["std"] }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true

[package.metadata.qa]
checks = [{ args = [] }, { args = ["--features", "server"] }, { args = ["--features", "daemon"] }, { args = ["--all-features"] }]
tests = [{ args = [] }, { args = ["--features", "server"] }, { args = ["--features", "daemon"] }, { args = ["--all-features"] }]

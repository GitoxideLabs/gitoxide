lints.workspace = true

[package]
name = "gix-filter"
version = "0.36.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project implementing git filters"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = [
    "/src/**/*",
    "/LICENSE-*",
    # Cargo packages declared examples and binaries, and the example includes the test helper.
    "/examples/arrow.rs",
    "/tests/helpers/arrow.rs",
]

[lib]
doctest = false

[[bin]]
name = "gix-filter-test-arrow"
path = "tests/helpers/arrow.rs"
# The self dev-dependency below enables this only while building tests.
required-features = ["test-helper"]
test = false
bench = false
doc = false

[[test]]
name = "threaded"
path = "tests/threaded.rs"
required-features = ["gix-parallel/parallel"]

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]
## Internal feature for building binaries referenced by integration tests through CARGO_BIN_EXE_*.
test-helper = ["gix-error/error-print-location"]

[dependencies]
gix-hash = { version = "^0.28.1", path = "../gix-hash" }
gix-trace = { version = "^0.3.1", path = "../gix-trace" }
gix-object = { version = "^0.66.1", path = "../gix-object" }
gix-command = { version = "^0.12.1", path = "../gix-command" }
gix-quote = { version = "^0.10.1", path = "../gix-quote" }
gix-utils = { version = "^0.5.2", path = "../gix-utils" }
gix-path = { version = "^0.14.1", path = "../gix-path" }
gix-packetline = { version = "^0.24.1", path = "../gix-packetline", features = ["blocking-io"] }
gix-attributes = { version = "^0.37.1", path = "../gix-attributes" }

encoding_rs = "0.8.32"
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
gix-error = { version = "^0.5.2", path = "../gix-error" }
smallvec = "1.15.1"


[dev-dependencies]
insta = "1.46.3"
gix-filter = { path = ".", features = ["test-helper"] }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-quote = { path = "../gix-quote" }
gix-parallel = { path = "../gix-parallel" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["repo-snapshot", "sha1", "sha256"] }
gix-worktree = { path = "../gix-worktree", default-features = false, features = ["attributes"] }

[package.metadata.docs.rs]
features = ["sha1"]

[package.metadata.ci]
tests = [
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha1" } },
    { args = [], env = { GIX_TEST_FIXTURE_HASH = "sha256" } },
    { args = ["--features", "gix-parallel/parallel", "--test", "threaded"], packages = ["gix-filter", "gix-pathspec"] },
]

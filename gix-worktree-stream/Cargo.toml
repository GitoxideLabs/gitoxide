lints.workspace = true

[package]
name = "gix-worktree-stream"
version = "0.37.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "generate a byte-stream from a git-tree"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
gix-features = { version = "^0.50.0", path = "../gix-features", features = ["progress", "io-pipe", "parallel"] }
gix-hash = { version = "^0.27.0", path = "../gix-hash" }
gix-object = { version = "^0.65.0", path = "../gix-object" }
gix-attributes = { version = "^0.36.0", path = "../gix-attributes", features = ["parallel"] }
gix-filter = { version = "^0.35.0", path = "../gix-filter" }
gix-traverse = { version = "^0.62.0", path = "../gix-traverse" }
gix-fs = { version = "^0.23.0", path = "../gix-fs" }
gix-path = { version = "^0.13.0", path = "../gix-path" }

gix-error = { version = "^0.4.0", path = "../gix-error" }
parking_lot = "0.12.4"

[dev-dependencies]
insta = "1.46.3"
gix-worktree-stream = { path = ".", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }
gix-hash = { path = "../gix-hash" }
gix-odb = { path = "../gix-odb" }
gix-worktree = { path = "../gix-worktree", default-features = false, features = ["attributes"] }

[package.metadata.docs.rs]
features = ["sha1"]

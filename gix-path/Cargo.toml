lints.workspace = true

[package]
name = "gix-path"
version = "0.12.5"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing paths and their conversions"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.85"

[lib]
doctest = true

[dependencies]
gix-error = { version = "^0.3.0", path = "../gix-error" }
gix-trace = { version = "^0.1.21", path = "../gix-trace" }
gix-validate = { version = "^0.11.4", path = "../gix-validate" }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }

[dev-dependencies]
serial_test = { version = "3.4.0", default-features = false }
tempfile = "3.26.0"

[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62.1", features = [
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
winreg = "0.56.0"

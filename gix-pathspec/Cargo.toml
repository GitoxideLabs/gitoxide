lints.workspace = true

[package]
name = "gix-pathspec"
version = "0.22.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing magical pathspecs"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]

[lib]
doctest = true

[[test]]
name = "threaded"
path = "tests/threaded.rs"
required-features = ["gix-parallel/parallel"]

[dependencies]
gix-glob = { version = "^0.29.0", path = "../gix-glob" }
gix-path = { version = "^0.14.0", path = "../gix-path" }
gix-attributes = { version = "^0.37.0", path = "../gix-attributes" }
gix-config-value = { version = "^0.21.0", path = "../gix-config-value" }
gix-error = { version = "^0.5.0", path = "../gix-error", features = ["bstr"] }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = "2"

[dev-dependencies]
insta = "1.46.3"
gix-parallel = { path = "../gix-parallel" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["repo-snapshot", "sha1"] }
serial_test = "3.4.0"

lints.workspace = true

[package]
name = "gix-pathspec"
version = "0.19.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing magical pathspecs"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.85"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]

[lib]
doctest = true

[features]
## Enable thread-safety.
parallel = ["gix-attributes/parallel"]

[dependencies]
gix-glob = { version = "^0.27.0", path = "../gix-glob" }
gix-path = { version = "^0.12.3", path = "../gix-path" }
gix-attributes = { version = "^0.34.0", path = "../gix-attributes" }
gix-config-value = { version = "^0.19.0", path = "../gix-config-value" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = "2"

[dev-dependencies]
gix-testtools = { path = "../tests/tools" }
serial_test = "3.4.0"

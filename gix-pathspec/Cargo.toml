lints.workspace = true

[package]
name = "gix-pathspec"
version = "0.20.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dealing magical pathspecs"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.85"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]

[lib]
doctest = true

[features]
## Enable thread-safety.
parallel = ["gix-attributes/parallel"]

[dependencies]
gix-glob = { version = "^0.27.1", path = "../gix-glob" }
gix-path = { version = "^0.12.5", path = "../gix-path" }
gix-attributes = { version = "^0.35.0", path = "../gix-attributes" }
gix-config-value = { version = "^0.19.1", path = "../gix-config-value" }
gix-error = { version = "^0.3.0", path = "../gix-error" }

bstr = { version = "1.12.0", default-features = false, features = ["std"] }
bitflags = "2"
thiserror = "2.0.18"

[dev-dependencies]
gix-testtools = { path = "../tests/tools" }
serial_test = "3.4.0"

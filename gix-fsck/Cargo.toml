lints.workspace = true

[package]
name = "gix-fsck"
version = "0.27.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Cameron Esfahani <cesfahani@gmail.com>", "Sebastian Thiel <sebastian.thiel@icloud.com>"]
license = "MIT OR Apache-2.0"
description = "Verifies the connectivity and validity of objects in the database"
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false

[features]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix-hash/sha256"]

[dependencies]
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
gix-config = { version = "^0.62.2", path = "../gix-config" }
gix-validate = { version = "^0.13.1", path = "../gix-validate" }
gix-error = { version = "^0.5.2", path = "../gix-error" }
gix-hash = { version = "^0.28.1", path = "../gix-hash" }
gix-hashtable = { version = "^0.18.1", path = "../gix-hashtable" }
gix-object = { version = "^0.66.1", path = "../gix-object" }

[dev-dependencies]
gix-odb = { path = "../gix-odb", features = ["sha1", "sha256"] }
gix-testtools = { path = "../tests/tools" }

[package.metadata.docs.rs]
features = ["sha1"]

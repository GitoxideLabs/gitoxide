name: ci

on:
  push:
    branches:
      - main
      - "run-ci/**"
      - "**/run-ci/**"
  pull_request:
  workflow_dispatch:

# Keep every landed commit's exhaustive run, while cancelling obsolete PR runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: "1"

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-plan
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Test the planner without building Git tooling
        run: cargo run --locked -p internal-tools --no-default-features --bin ci -- run --mode exhaustive --stage self-test
      - name: Select checks and distribute them across platforms
        id: plan
        env:
          CI_MODE: ${{ github.event_name == 'pull_request' && 'fast' || 'exhaustive' }}
          CI_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: cargo run --locked -p internal-tools --no-default-features --bin ci -- plan --all-platforms --mode "$CI_MODE" --base "$CI_BASE" --github-output "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    continue-on-error: ${{ !matrix.blocking }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan }}
      CI_JOB: ${{ matrix.id }}
    steps:
      # Native 32-bit containers need libraries for the runner's 64-bit Node.js.
      - name: Install container prerequisites
        if: matrix.container != ''
        shell: bash
        env:
          RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: |
          prerequisites=(
            build-essential
            ca-certificates
            cmake
            curl
            git
            jq
            libssl-dev
            "libstdc++6:$RUNNER_ARCHITECTURE"
            pkgconf
            python3-minimal
          )
          dpkg --add-architecture "$RUNNER_ARCHITECTURE"
          apt-get update
          apt-get install --no-install-recommends -y -- "${prerequisites[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # API comparisons need release tags; other tasks consume the saved plan.
          fetch-depth: ${{ matrix.semver && '0' || '1' }}
      - name: Install native Rust
        if: matrix.container == ''
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - name: Install container Rust
        if: matrix.container != ''
        shell: bash
        env:
          HOST_TRIPLE: ${{ matrix.host }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --default-host "$HOST_TRIPLE" --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install Rust components
        if: matrix.clippy
        shell: bash
        run: rustup component add clippy rustfmt
      - name: Install the API checker's Rust version
        if: matrix.semver
        shell: bash
        # The API collector understands rustdoc JSON format 61.
        run: rustup toolchain install 1.99.0 --profile minimal
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: matrix.just
        with:
          just-version: '1.58.0'
      - name: Install MSRV toolchains
        if: matrix.msrv
        shell: bash
        run: |
          msrv="$(just msrv)"
          rustup toolchain install "$msrv" nightly --profile minimal --no-self-update
      - name: Install WebAssembly targets
        if: matrix.wasm
        shell: bash
        run: rustup target add wasm32-unknown-unknown wasm32-wasip1 wasm32-wasip2
      - name: Install the 32-bit Windows target
        if: matrix.size32
        shell: bash
        run: rustup target add i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.cache || matrix.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the selected Rust tools
        if: join(matrix.tools, ',') != ''
        uses: taiki-e/install-action@9983c65e42da123ff25d1f78505eb6de315aa172 # v2.87.20
        with:
          tool: ${{ join(matrix.tools, ',') }}
      - name: Install the workflow YAML reader
        if: matrix.yq
        shell: bash
        env:
          YQ_VERSION: v4.49.2
        run: |
          curl -LSfs "https://github.com/mikefarah/yq/releases/download/$YQ_VERSION/yq_linux_amd64" -o "$RUNNER_TEMP/yq"
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$RUNNER_TEMP/yq" "$HOME/.local/bin/yq"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install archive test dependencies
        if: matrix.xz && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblzma-dev
      - name: Install cargo diet
        if: matrix.diet
        shell: bash
        env:
          CARGO_DIET_TAG: v1.2.7
        run: |
          curl -LSfs "https://raw.githubusercontent.com/the-lean-crate/cargo-diet/refs/tags/$CARGO_DIET_TAG/ci/install.sh" |
            sh -s -- --git the-lean-crate/cargo-diet --target x86_64-unknown-linux-musl --tag "$CARGO_DIET_TAG"
      - name: Run the selected checks
        # Keep Windows' native shell; the shared runner configures every task's environment.
        run: cargo run --locked -p internal-tools --no-default-features --bin ci -- run --from-env

  tests-pass:
    name: Tests pass
    permissions: {}
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Require the planner and all blocking checks to succeed
        if: needs.plan.result != 'success' || needs.run.result != 'success'
        run: exit 1
      - name: OK
        run: exit 0

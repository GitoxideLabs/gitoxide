name: ci

on:
  push:
    branches:
      - main
      - "run-ci/**"
      - "**/run-ci/**"
  pull_request:
  workflow_dispatch:

# Keep every landed commit's exhaustive run, while cancelling obsolete PR runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CLICOLOR: "1"
  # Match the workspace profile, including builds in downstream workspaces.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_DEV_STRIP: debuginfo

jobs:
  plan:
    name: Select QA work
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      plan: ${{ steps.plan.outputs.plan }}
      downstream: ${{ steps.plan.outputs.downstream }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR merge commits include the comparison base as a parent.
          fetch-depth: ${{ github.event_name == 'pull_request' && '2' || '1' }}
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ci-plan
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Cache dependency metadata for offline feature selection
        run: cargo fetch --locked
      - name: Test the planner without building Git tooling
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- run --mode exhaustive --stage self-test
      - name: Select checks and distribute them across platforms
        id: plan
        env:
          QA_MODE: ${{ github.event_name == 'pull_request' && 'fast' || 'exhaustive' }}
          QA_BASE: ${{ github.event.pull_request.base.sha || github.sha }}
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- plan --all-platforms --mode "$QA_MODE" --base "$QA_BASE" --github-output "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.id }}
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    continue-on-error: ${{ !matrix.blocking }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }} # zizmor: ignore[unpinned-images] SHA256 pins in tests/it/src/qa/catalog.rs.
    permissions:
      contents: read
      actions: read
    env:
      QA_PLAN: ${{ needs.plan.outputs.plan }}
      QA_JOB: ${{ matrix.id }}
      # Main provides reusable indexes; PR cache misses run ordinary QA without collecting throwaway data.
      GIX_QA_COVERAGE: ${{ vars.QA_COVERAGE != 'off' && (contains(matrix.tasks, 'native-tests') || contains(matrix.tasks, 'isolated-tests') || contains(matrix.tasks, 'feature-tests')) && (github.event_name == 'pull_request' && (vars.QA_COVERAGE == 'shadow' && 'shadow' || 'prune') || github.ref == 'refs/heads/main' && 'collect') || 'off' }}
    steps:
      # Native 32-bit containers need libraries for the runner's 64-bit Node.js.
      - name: Install container prerequisites
        if: matrix.container != ''
        shell: bash
        env:
          RUNNER_ARCHITECTURE: ${{ matrix.runner_architecture }}
        run: |
          prerequisites=(
            build-essential
            ca-certificates
            cmake
            curl
            git
            jq
            libssl-dev
            "libstdc++6:$RUNNER_ARCHITECTURE"
            pkgconf
            python3-minimal
          )
          dpkg --add-architecture "$RUNNER_ARCHITECTURE"
          apt-get update
          apt-get install --no-install-recommends -y -- "${prerequisites[@]}"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Automatic coverage compares with the base parent of GitHub's PR merge commit.
          fetch-depth: ${{ matrix.history && '0' || github.event_name == 'pull_request' && '2' || '1' }}
      - name: Install native Rust
        if: matrix.container == ''
        shell: bash
        run: |
          rustup update stable
          rustup default stable
      - name: Install container Rust
        if: matrix.container != ''
        shell: bash
        env:
          HOST_TRIPLE: ${{ matrix.host }}
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --default-host "$HOST_TRIPLE" --default-toolchain stable --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Install additional Rust toolchains
        if: join(matrix.rust_toolchains, ' ') != ''
        shell: bash
        env:
          RUST_TOOLCHAINS: ${{ join(matrix.rust_toolchains, ' ') }}
        run: |
          read -r -a toolchains <<< "$RUST_TOOLCHAINS"
          for toolchain in "${toolchains[@]}"; do
            if [[ "$toolchain" != stable ]]; then
              rustup toolchain install "$toolchain" --profile minimal --no-self-update
            fi
          done
      - name: Install Rust components
        if: toJSON(matrix.rust_components) != '[]'
        shell: bash
        env:
          RUST_COMPONENTS: ${{ toJSON(matrix.rust_components) }}
        run: |
          jq -r '.[] | [.toolchain, .component] | @tsv' <<< "$RUST_COMPONENTS" | tr -d '\r' |
            while IFS=$'\t' read -r toolchain component; do
              rustup component add --toolchain "$toolchain" "$component"
            done
      - name: Install Rust targets
        if: toJSON(matrix.rust_targets) != '[]'
        shell: bash
        env:
          RUST_TARGETS: ${{ toJSON(matrix.rust_targets) }}
        run: |
          jq -r '.[] | [.toolchain, .target] | @tsv' <<< "$RUST_TARGETS" | tr -d '\r' |
            while IFS=$'\t' read -r toolchain target; do
              rustup target add --toolchain "$toolchain" "$target"
            done
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: matrix.just
        with:
          just-version: ${{ matrix.just_version }} # zizmor: ignore[unpinned-tools] Exact version in Cargo.toml's workspace.metadata.qa.tool-versions.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: ${{ matrix.cache || matrix.id }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install the selected Rust tools
        if: join(matrix.tools, ',') != ''
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: ${{ join(matrix.tools, ',') }}
      - name: Install archive test dependencies
        if: matrix.xz && runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends liblzma-dev
      - name: Install cargo diet
        if: matrix.diet
        shell: bash
        env:
          CARGO_DIET_TAG: v${{ matrix.diet_version }}
        run: |
          curl -LSfs "https://raw.githubusercontent.com/the-lean-crate/cargo-diet/refs/tags/$CARGO_DIET_TAG/ci/install.sh" |
            sh -s -- --git the-lean-crate/cargo-diet --target x86_64-unknown-linux-musl --tag "$CARGO_DIET_TAG"
      - name: Install optional coverage tools
        if: env.GIX_QA_COVERAGE == 'collect'
        continue-on-error: true
        shell: bash
        run: rustup component add llvm-tools-preview --toolchain stable
      - name: Download optional coverage indexes from the PR base
        if: env.GIX_QA_COVERAGE == 'shadow' || env.GIX_QA_COVERAGE == 'prune'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha }}
          COVERAGE_ARTIFACT: qa-coverage-${{ matrix.id }}
        run: |
          coverage_run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main \
            --commit "$COVERAGE_BASE" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          test -n "$coverage_run"
          gh run download "$coverage_run" --repo "$GITHUB_REPOSITORY" --name "$COVERAGE_ARTIFACT" \
            --dir target/qa-coverage/indexes
      - name: Run the selected checks
        # Keep Windows' native shell; the shared runner configures every task's environment.
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- run --from-env
      - name: Publish optional coverage indexes
        if: success() && env.GIX_QA_COVERAGE == 'collect'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qa-coverage-${{ matrix.id }}
          path: target/qa-coverage/indexes/*.json
          if-no-files-found: ignore
          retention-days: 14

  downstream:
    name: Consumer / ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.downstream != ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.downstream) }}
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - name: Check out the gix version under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: gitoxide
          persist-credentials: false
      - name: Check out the consumer's default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: consumer
          persist-credentials: false
      - name: Install GitButler dependencies
        if: matrix.repository == 'gitbutlerapp/gitbutler'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - name: Install GitButler GPUI dependencies
        if: matrix.name == 'gitbutler-gpui'
        run: sudo apt-get install -y --no-install-recommends libxcb1-dev libxkbcommon-x11-dev libfontconfig-dev
      - name: Install Zig for GitButler's terminal
        if: matrix.name == 'gitbutler-gpui'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.17.0
          use-cache: false
      - name: Install Rust
        run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: downstream-${{ matrix.name }}
          workspaces: |
            gitoxide -> target
            consumer -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the consumer with this gix
        working-directory: gitoxide
        env:
          QA_DOWNSTREAM_NAME: ${{ matrix.name }}
        run: cargo run --profile qa --locked -p internal-tools --no-default-features --bin qa -- downstream "$QA_DOWNSTREAM_NAME" --checkout ../consumer

  tests-pass:
    name: Tests pass
    permissions: {}
    needs: [plan, run]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Require the planner and all blocking checks to succeed
        if: needs.plan.result != 'success' || needs.run.result != 'success'
        run: exit 1
      - name: OK
        run: exit 0

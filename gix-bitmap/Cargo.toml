lints.workspace = true

[package]
name = "gix-bitmap"
version = "0.6.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project dedicated implementing the standard git bitmap format"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = true
test = true

[dependencies]
gix-error = { version = "^0.5.2", path = "../gix-error" }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false }

[package.metadata.qa.wasm]
targets = ["wasm32-unknown-unknown", "wasm32-wasip1", "wasm32-wasip2"]

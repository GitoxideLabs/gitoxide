lints.workspace = true

[package]
name = "gix-zlib"
description = "Zlib-rs streaming compression and decompression utilities used by gitoxide"
repository = "https://github.com/GitoxideLabs/gitoxide"
version = "0.3.0"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[lib]
doctest = false
test = false

[features]
serde = ["dep:serde"]
## Decompress whole zlib streams and find where streamed ones end with [`sirocco`](https://docs.rs/sirocco),
## which is faster than `zlib-rs` at it. `zlib-rs` still handles partial output, errors and all compression.
## This requires Rust 1.89 or newer.
sirocco = ["dep:sirocco"]

[dependencies]
gix-error = { version = "^0.5.1", path = "../gix-error" }
zlib-rs = "0.6.2"
sirocco = { version = "0.1.0", optional = true }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

[dev-dependencies]
insta = "1.46.3"
bstr = { version = "1.12.0", default-features = false }

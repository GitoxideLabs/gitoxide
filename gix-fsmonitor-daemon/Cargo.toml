lints.workspace = true

[package]
name = "gix-fsmonitor-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A filesystem monitor daemon implementing Git hook v2 and native IPC"
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
include = ["/src/**/*", "/LICENSE-*", "/README.md"]

[[bin]]
name = "gix-fsmonitor"
path = "src/main.rs"
doc = false

[dependencies]
anyhow = "1.0.102"
gix = { version = "^0.90.0", path = "../gix", default-features = false, features = ["sha1", "sha256"] }
gix-fsmonitor = { version = "^0.1.0", path = "../gix-fsmonitor", features = ["server"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.183"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }

[dev-dependencies]
gix-testtools = { version = "^0.22.0", path = "../tests/tools", default-features = false, features = ["sha1"] }

lints.workspace = true

[package]
name = "gix-fsmonitor-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A filesystem monitor daemon implementing Git hook v2 and native IPC"
repository = "https://github.com/GitoxideLabs/gitoxide"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
include = ["/src/**/*", "/LICENSE-*", "/README.md"]

[[bin]]
name = "gix-fsmonitor"
path = "src/main.rs"
doc = false

[features]
sha1 = ["gix/sha1"]
sha256 = ["gix/sha256"]

[dependencies]
anyhow = "1.0.102"
gix = { version = "^0.90.0", path = "../gix", default-features = false, features = ["fsmonitor-daemon"] }

[dev-dependencies]
gix-testtools = { version = "^0.22.0", path = "../tests/tools", default-features = false, features = ["sha1"] }
gix-fsmonitor-daemon = { path = ".", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true

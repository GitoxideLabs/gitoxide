lints.workspace = true

[package]
name = "gix-date"
version = "0.18.1"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project parsing dates the way git does"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = true

[features]
# Preserve the existing API while the crate itself is still pre-1.0.
default = ["unstable"]
## Expose experimental members of provisionally supported time types.
unstable = []
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "bstr/serde"]

[dependencies]
gix-macros = { version = "^0.2.0", path = "../gix-macros" }
gix-error = { version = "^0.5.2", path = "../gix-error" }
bstr = { version = "1.12.0", default-features = false, features = ["std"] }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }
itoa = "1.0.17"
jiff = "0.2.25"

document-features = { version = "0.2.0", optional = true }

[dev-dependencies]
gix-date = { path = ".", features = ["unstable"] }
insta = "1.46.3"
gix-hash = { path = "../gix-hash" }
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1"] }
pretty_assertions = "1.4.1"

[package.metadata.docs.rs]
all-features = true
features = ["document-features"]

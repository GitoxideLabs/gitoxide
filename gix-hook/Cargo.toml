lints.workspace = true

[package]
name = "gix-hook"
version = "0.1.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate of the gitoxide project for discovering and running Git hooks"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]

[dependencies]
gix-error = { version = "^0.5.2", path = "../gix-error", features = ["bstr"] }
gix-command = { version = "^0.12.1", path = "../gix-command" }
gix-path = { version = "^0.14.1", path = "../gix-path" }
gix-sec = { version = "^0.16.1", path = "../gix-sec" }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[dev-dependencies]
gix-testtools = { path = "../tests/tools", features = ["sha1"] }

[package.metadata.docs.rs]
all-features = true

lints.workspace = true

[package]
name = "gix-tix"
version = "0.3.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A tool like `tig`, but minimal, fast and efficient"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
rust-version = "1.88"
include = ["/src/**/*", "/LICENSE-*"]

[[bin]]
name = "tix"
path = "src/main.rs"
required-features = ["sha1"]

[features]
## Enable blocking network operations and their progress tree.
blocking-network-client = ["gix/blocking-network-client"]
## Enable support for the SHA-1 hash by forwarding the feature to dependencies.
sha1 = ["gix/sha1"]
## Enable support for the SHA-256 hash by forwarding the feature to dependencies.
sha256 = ["gix/sha256"]

[dependencies]
anyhow = "1.0.98"
clap = { version = "4.5.42", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["osc52"] }
directories = "6.0.0"
gix = { version = "^0.87.1", path = "../gix", default-features = false, features = ["blob-diff", "mailmap", "merge", "notes", "parallel", "progress-tree", "revision", "command", "status", "worktree-mutation"] }
notify = "8.2.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
terminal-colorsaurus = "1.0.3"
tracing = "0.1.37"
tracing-appender = "0.2.4"
tracing-forest = "0.1.5"
tracing-subscriber = "0.3.17"
tui-markdown = { version = "0.3.9", default-features = false }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", features = ["sha1"] }
insta = "1.46.3"

[package.metadata.docs.rs]
features = ["sha1"]

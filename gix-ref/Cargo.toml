lints.workspace = true

[package]
name = "gix-ref"
version = "0.66.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate to handle git references"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.85"

[lib]
doctest = false
test = true

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "gix-hash/serde", "gix-actor/serde", "gix-object/serde"]
## Enable support for thread-safety.
parallel = ["gix-features/parallel"]

[dependencies]
gix-features = { version = "^0.49.0", path = "../gix-features", features = ["walkdir"] }
gix-fs = { version = "^0.22.0", path = "../gix-fs" }
gix-path = { version = "^0.12.3", path = "../gix-path" }
gix-hash = { version = "^0.26.0", path = "../gix-hash" }
gix-object = { version = "^0.63.0", path = "../gix-object" }
gix-utils = { version = "^0.3.5", path = "../gix-utils" }
gix-validate = { version = "^0.11.3", path = "../gix-validate" }
gix-actor = { version = "^0.41.2", path = "../gix-actor" }
gix-lock = { version = "^24.0.0", path = "../gix-lock" }
gix-tempfile = { version = "^24.0.0", default-features = false, path = "../gix-tempfile" }

serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

# packed refs
memmap2 = "0.9.11"

document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false }
gix-date = { path = "../gix-date" }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-discover = { path = "../gix-discover" }
gix-odb = { path = "../gix-odb" }
insta = "1.46.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.186"

[package.metadata.docs.rs]
features = ["sha1", "document-features", "serde"]

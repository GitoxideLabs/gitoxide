lints.workspace = true

[package]
name = "gix-ref"
version = "0.69.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A crate to handle git references"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*"]
rust-version = "1.88"

[lib]
doctest = false
test = true

[[test]]
name = "threaded"
path = "tests/threaded.rs"
required-features = ["gix-parallel/parallel"]

[features]
## Enable support for the SHA-1 hash by enabling the respective feature in the `gix-hash` crate.
sha1 = ["gix-hash/sha1"]
## Enable support for the SHA-256 hash by enabling the respective feature in the `gix-hash` crate.
sha256 = ["gix-hash/sha256"]
## Data structures implement `serde::Serialize` and `serde::Deserialize`.
serde = ["dep:serde", "gix-hash/serde", "gix-actor/serde", "gix-object/serde"]

[dependencies]
gix-parallel = { version = "^0.50.0", path = "../gix-parallel" }
gix-error = { version = "^0.5.0", path = "../gix-error", features = ["bstr"] }
gix-fs = { version = "^0.24.0", path = "../gix-fs", features = ["walkdir"] }
gix-path = { version = "^0.14.0", path = "../gix-path" }
gix-hash = { version = "^0.28.0", path = "../gix-hash" }
gix-object = { version = "^0.66.0", path = "../gix-object" }
gix-utils = { version = "^0.5.0", path = "../gix-utils" }
gix-validate = { version = "^0.13.0", path = "../gix-validate" }
gix-actor = { version = "^0.44.0", path = "../gix-actor" }
gix-lock = { version = "^26.0.0", path = "../gix-lock" }
gix-tempfile = { version = "^26.0.0", default-features = false, path = "../gix-tempfile" }
serde = { version = "1.0.114", optional = true, default-features = false, features = ["derive"] }

# packed refs
memmap2 = "0.9.11"

document-features = { version = "0.2.1", optional = true }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1", "sha256"] }
gix-date = { path = "../gix-date" }
gix-hash = { path = "../gix-hash", features = ["sha1", "sha256"] }
gix-discover = { path = "../gix-discover" }
gix-odb = { path = "../gix-odb" }
insta = "1.46.3"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2.186"

[package.metadata.docs.rs]
features = ["sha1", "document-features", "serde"]

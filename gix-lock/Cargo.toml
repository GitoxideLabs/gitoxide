lints.workspace = true

[package]
name = "gix-lock"
version = "25.0.0"
repository = "https://github.com/GitoxideLabs/gitoxide"
license = "MIT OR Apache-2.0"
description = "A git-style lock-file implementation"
authors = ["Sebastian Thiel <sebastian.thiel@icloud.com>"]
edition = "2024"
include = ["/src/**/*", "/LICENSE-*", "/README.md"]
rust-version = "1.88"

[lib]
doctest = true
test = true

[dependencies]
gix-error = { version = "^0.4.0", path = "../gix-error" }
gix-fs = { version = "^0.23.0", path = "../gix-fs" }
gix-utils = { version = "^0.4.0", default-features = false, path = "../gix-utils" }
gix-tempfile = { version = "^25.0.0", default-features = false, path = "../gix-tempfile" }

[dev-dependencies]
gix-testtools = { path = "../tests/tools", default-features = false, features = ["sha1"] }
insta = { version = "1.46.3", features = ["filters"] }
tempfile = "3.26.0"
